[package]
name = "pi-evals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offline-first evaluation harness and suites for the Pi Rust port."

[lints]
workspace = true

[dependencies]
pi-protocol = { path = "../pi-protocol" }
pi-ai = { path = "../pi-ai" }
pi-agent-core = { path = "../pi-agent-core" }
pi-coding-agent = { path = "../pi-coding-agent" }
pi-extensions = { path = "../pi-extensions" }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio-util.workspace = true

# `tokio` is target-conditional in the sibling crates; the eval harness is
# native-only (it needs the filesystem and loopback fixtures), so the full
# workspace feature set is fine here.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
