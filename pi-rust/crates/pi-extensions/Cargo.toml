[package]
name = "pi-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JS extension host for Pi extensions. Loads JS/TS extension source into an embedded QuickJS runtime and bridges calls to the Rust agent."

[lints]
workspace = true

[dependencies]
pi-protocol = { path = "../pi-protocol" }
pi-agent-core = { path = "../pi-agent-core" }

# JS engine. `futures` enables `AsyncRuntime` / `AsyncContext` so we can
# drive the runtime from tokio and use `Async<F>` for the JS host imports
# that need to await host responses (ui.confirm / input / select).
rquickjs-core = { version = "0.9", default-features = false, features = ["futures", "parallel"] }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
walkdir.workspace = true
tracing.workspace = true
parking_lot.workspace = true
indexmap.workspace = true
once_cell = "1"
# `node:zlib`'s zstd family. Already in the workspace dependency graph
# (`pi-session` compresses its payload column with it), so this adds no
# crate to `Cargo.lock` — important for `--offline` builds.
zstd.workspace = true
# The `fetch` global's transport. The same `reqwest` build `pi-ai` uses, so the
# extension HTTP bridge shares one TLS / proxy-env policy with the providers
# instead of introducing a second HTTP stack.
reqwest.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
